<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Ken Howard</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh;
    display: grid; place-items: center; padding: 24px;
    font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #f4f2ec; color: #1d2630;
  }
  main { max-width: 30rem; }
  .mark {
    width: 40px; height: 40px; display: grid; place-items: center;
    background: #121a23; color: #c96442; font-weight: 800; margin-bottom: 22px;
  }
  p.eyebrow {
    font-size: 10px; letter-spacing: .16em; font-weight: 800;
    text-transform: uppercase; color: #6d7a86; margin: 0 0 8px;
  }
  h1 { font-size: 1.4rem; margin: 0 0 14px; font-weight: 700; }
  p { margin: 0 0 12px; }
  small { color: #6d7a86; font-size: 13px; }
  @media (prefers-color-scheme: dark) {
    body { background: #121a23; color: #e8e6e0; }
    .mark { background: #e8e6e0; color: #c96442; }
    p.eyebrow, small { color: #94a1ad; }
  }
</style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">I</div>
    <p class="eyebrow">Rebuilding</p>
    <h1>This site is being rebuilt.</h1>
    <p>The parametric plan study that was here has been withdrawn while its source-evidence handling is reworked.</p>
    <p><small>Ken Howard</small></p>
  </main>
</body>
</html>
